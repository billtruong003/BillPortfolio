name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches-ignore: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # data/posts.json is generated, not committed. Typecheck needs it because
      # data/posts.ts imports it, so build the manifest before any check runs.
      - name: Compile posts
        run: npm run compile-posts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # No secrets here: the build must succeed without analytics or API keys.
      - name: Build
        run: npm run build
